[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "movielens-client"
version = "0.1.0"
description = "Thin client for movielens.org's unpublished JSON API: login, paged ratings, paged predictions, rating writes."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Klaus Karkia", email = "klaus.karkia@gmail.com" }]
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = [
  "live: hits the real movielens.org API with credentials from .env; not run by default",
]
